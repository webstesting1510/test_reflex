<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator">
    <h1>Test Calculator</h1>
    <p>Enter two numbers and select an operation.</p>

    <label for="firstNumber">First number</label>
    <input id="firstNumber" type="number" placeholder="Enter first number" />

    <label for="secondNumber">Second number</label>
    <input id="secondNumber" type="number" placeholder="Enter second number" />

    <div class="buttons">
      <button onclick="calculate('+')">Add</button>
      <button onclick="calculate('-')">Subtract</button>
      <button onclick="calculate('*')">Multiply</button>
      <button onclick="calculate('/')">Divide</button>
    </div>

    <p id="result" aria-live="polite">Result will appear here.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
